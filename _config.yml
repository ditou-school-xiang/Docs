# Site
title: 我的Hexo博客
subtitle: ''
description: ''
keywords:
author: ditou-school-xiang
language: zh-CN
timezone: ''

# URL
url: https://ditou-school-xiang.github.io
root: /
permalink: post/:title.html
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  open_new_tab: true
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false

# Deployment
deploy:
  type: git
  repo: https://github.com/ditou-school-xiang/ditou-school-xiang.github.io.git
  branch: main
